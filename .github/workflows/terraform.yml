name: Terraform CI

on:
  push:
    branches: ["dev", "master"]

jobs:
  terraform:
    runs-on: ubuntu-latest

    env:
      TF_VAR_environment: ${{ github.ref_name }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.5

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-southeast-2

      - name: Terraform Format
        run: terraform fmt -check -recursive

      - name: Terraform Init
        run: terraform init

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan (dev)
        if: github.ref_name == 'dev'
        run: terraform plan -var-file=env/dev/dev.tfvars

      - name: Terraform Plan (prod)
        if: github.ref_name == 'master'
        run: terraform plan -var-file=env/prod/prod.tfvars

      - name: Terraform Apply (dev auto)
        if: github.ref_name == 'dev'
        run: terraform apply -auto-approve -var-file=env/dev/dev.tfvars

      - name: Terraform Apply (prod manual)
        if: github.ref_name == 'master'
        run: terraform apply -var-file=env/prod/prod.tfvars
